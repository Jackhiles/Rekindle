[package]
name = "rekindle"
version = "0.1.0"
edition = "2021"
description = "Clean-room, open-source runtime for Clickteam Fusion 2.5 game data (bring your own game files)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "rekindle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.17"
macroquad = { version = "0.4", features = ["audio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memmap2 = "0.9"
rfd = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "ogg", "vorbis"] }

[profile.dev]
# Decompressing large image banks is painfully slow without optimisation.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
