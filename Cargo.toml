[package]
name = "rekindle"
version = "0.1.4"
edition = "2021"
description = "Clean-room, open-source runtime for Clickteam Fusion 2.5 game data (bring your own game files)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "rekindle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.17"
macroquad = { version = "0.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memmap2 = "0.9"
serde_json = "1"
# Gamepads (XInput / Windows.Gaming.Input, evdev on Linux) mapped to keyboard + mouse.
# Text for generated library artwork (already used by macroquad).
fontdue = "0.9"
# Steam's cached library artwork (covers in the launcher) is JPEG.
jpeg-decoder = { version = "0.3", default-features = false }
gilrs = "0.11"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "ogg", "vorbis"] }
cpal = "0.15"

[build-dependencies]
# Windows: embeds the .exe icon.
embed-resource = "3"

# Native file dialogs. On Linux (e.g. Steam Deck) the desktop's own picker
# (kdialog / zenity) is used instead, which avoids GTK / Wayland build dependencies.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[profile.dev]
# Decompressing large image banks is painfully slow without optimisation.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
