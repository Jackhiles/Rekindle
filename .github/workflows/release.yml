name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a release.
# The launcher's updater downloads the files named below.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            built: target/release/rekindle.exe
            asset: rekindle-windows-x86_64.exe
          # Ubuntu 22.04's older glibc keeps the binary compatible with SteamOS and most distros.
          - os: ubuntu-22.04
            built: target/release/rekindle
            asset: rekindle-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (X11, OpenGL, ALSA, udev for gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Name the file for the updater
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.asset }}"
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/rekindle AppDir/usr/bin/rekindle
          ln -s usr/bin/rekindle AppDir/AppRun
          target/release/rekindle --write-icon AppDir/rekindle.png
          cat > AppDir/rekindle.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Rekindle
          Comment=Runtime and launcher for Clickteam Fusion games
          Exec=rekindle %f
          Icon=rekindle
          Categories=Game;
          Terminal=false
          EOF
          sed -i 's/^ *//' AppDir/rekindle.desktop
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir Rekindle-x86_64.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            Rekindle-x86_64.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true
